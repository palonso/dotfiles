# remap prefix from 'C-b' to 'C-q'
# Others prefer 'C-a' but I like the default bash keymap
# to go to the beggining of the line
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# set vim motions
setw -g mode-keys vi

# switch panes using Alt-arrow without prefix
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# move (swap) the current pane left/right with the neighbouring pane
bind H swap-pane -s '{left-of}'
bind L swap-pane -s '{right-of}'

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# enable mouse mode (tmux 2.1 and above)
set -g mouse on

set -g default-terminal "tmux-256color"

# bar position on top
set-option -g status-position top

# renumber windows
set-option -g renumber-windows on

# don't rename windows automatically
set-option -g allow-rename off

# start window/pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

# support extended keys. Required by pi
set -g extended-keys on
set -g extended-keys-format csi-u

# Theme options must be set before tpm loads the plugin.
set -g @tmux-gruvbox "dark"
set -g @tmux-gruvbox-statusbar-alpha "true"

# List of plugins
# Keep the theme first so tmux-cpu can interpolate into the line it builds.
set -g @plugin "egel/tmux-gruvbox"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-cpu"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"

# --- post-tpm overrides: tpm would otherwise overwrite these ---

# gruvbox dark palette
set -g @gruvbox_bg1 "#3c3836"
set -g @gruvbox_bg2 "#504945"
set -g @gruvbox_bg4 "#7c6f64"
set -g @gruvbox_fg3 "#bdae93"
set -g @gruvbox_fg4 "#a89984"
set -g @gruvbox_orange "#fe8019"

# Windows on the left: drop the theme's own left section.
set -g status-justify left
set -g status-left ""

# folder | cpu | session. Built by hand rather than via the theme's X/Y/Z
# sections so the session pill can react to the prefix key (C-q -> orange).
set -g status-right "#[bg=default,fg=#{E:@gruvbox_bg2}]#[bg=#{E:@gruvbox_bg2},fg=#{E:@gruvbox_fg4}] #{s|$HOME|~|:pane_current_path} #[fg=#{E:@gruvbox_bg4}]#[fg=#{E:@gruvbox_fg4}]  #{cpu_percentage} #[bg=#{E:@gruvbox_bg2},fg=#{?client_prefix,#{E:@gruvbox_orange},#{E:@gruvbox_fg3}}]#[bg=#{?client_prefix,#{E:@gruvbox_orange},#{E:@gruvbox_fg3}},fg=#{E:@gruvbox_bg1},bold] #S "

# Resolve #{cpu_percentage} inside the status line we just built.
run "~/.config/tmux/plugins/tmux-cpu/cpu.tmux"

# CPU refresh rate (default 15s); the prefix indicator redraws on its own.
set -g status-interval 5

# Transparent status bar (inherit terminal background).
set -g status-style "bg=default,fg=#ebdbb2"
